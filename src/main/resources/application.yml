spring:
  application:
    name: staffdesk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/staffdesk}
    username: ${DB_USER:staffdesk}
    password: ${DB_PASSWORD:staffdesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # şema yalnızca Flyway migrasyonlarıyla yönetilir; Hibernate yalnızca doğrular
  flyway:
    enabled: true

staffdesk:
  jwt:
    # En az 32 karakter. Üretimde JWT_SECRET ortam değişkeniyle verilmelidir.
    secret: ${JWT_SECRET:}
    ttl-minutes: 480
  # Resmi tatiller. Hiç tatil tanımlı olmayan yıl için izin talebi reddedilir (iş günü hesabı sessizce yanlış
  # çıkmasın). Her yıl başında o yılın tatilleri eklenmelidir; dini bayramlar Diyanet takvimine göre girilir.
  # Arife yarım günleri tam iş günü sayılır.
  holidays:
    # 2026: ulusal bayramlar
    - 2026-01-01
    - 2026-04-23
    - 2026-05-01
    - 2026-05-19
    - 2026-07-15
    - 2026-08-30
    - 2026-10-29
    # 2026: Ramazan Bayramı (20-22 Mart)
    - 2026-03-20
    - 2026-03-21
    - 2026-03-22
    # 2026: Kurban Bayramı (27-30 Mayıs)
    - 2026-05-27
    - 2026-05-28
    - 2026-05-29
    - 2026-05-30
  # Veritabanında hiç ADMIN yoksa açılışta bir yönetici oluşturulur (ikisi de verilirse).
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: Sistem Yöneticisi

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  error:
    include-message: never
    include-stacktrace: never
