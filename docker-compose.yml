services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: staffdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanımlanmalı}
      POSTGRES_DB: staffdesk
    volumes:
      - staffdesk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffdesk"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/staffdesk
      DB_USER: staffdesk
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanımlanmalı}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET tanımlanmalı (en az 32 karakter)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  staffdesk-data: